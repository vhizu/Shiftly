name: Build Shiftly 1.9.0 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate design, JSON import and island assets
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          live = Path("ShiftlyLive/ShiftlyLive.swift").read_text()
          backup = Path("Shiftly/BackupCenterView.swift").read_text()
          design = Path("Shiftly/ShiftlyDesign.swift").read_text()
          assert 'Text(timerInterval:' in live, "Live countdown missing"
          assert 'Button(intent: FinishBreakIntent())' in live, "Lock screen action missing"
          assert 'Image("IslandIconBreak")' in live, "Verified mascot asset not referenced"
          assert Path('ShiftlyLive/Assets.xcassets/IslandIconBreak.imageset/IslandIconBreak.png').is_file()
          assert 'UIDocumentPickerViewController' in backup, "Broad JSON picker missing"
          assert 'Обновить список файлов' in backup, "Refresh action missing"
          assert 'saveBeforeRestore' in backup, "Pre-restore backup missing"
          assert 'glassEffect' in design, "Native Liquid Glass controls missing"
          print("Shiftly 1.9 source validations OK")
          PYCODE
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project Shiftly.xcodeproj -scheme Shiftly -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO clean build
      - name: Verify version, app extensions and Live Activity assets
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.9.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.shiftly.app"
          for EXT in ShiftlyLive ShiftlyHomeWidget; do
            PLIST="$APP/PlugIns/$EXT.appex/Info.plist"
            test -f "$PLIST"
            case "$EXT" in
              ShiftlyLive) EXPECTED=com.shiftly.app.live ;;
              ShiftlyHomeWidget) EXPECTED=com.shiftly.app.home ;;
            esac
            FOUND=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
            test "$FOUND" = "$EXPECTED" || { echo "Wrong $EXT bundle ID: $FOUND"; exit 1; }
          done
          test -f "$APP/PlugIns/ShiftlyLive.appex/Assets.car"
          for EXT in ShiftlyLive ShiftlyHomeWidget; do
            EXT_PLIST="$APP/PlugIns/$EXT.appex/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT_PLIST"
            /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$EXT_PLIST"
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT_PLIST"
          done
          echo "Validated app 1.9.0 and both embedded extensions"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Shiftly-1.9.0-unsigned.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/Shiftly-1.9.0-unsigned.ipa" | grep 'ShiftlyHomeWidget.appex/Info.plist'
          unzip -l "$GITHUB_WORKSPACE/Shiftly-1.9.0-unsigned.ipa" | grep 'ShiftlyLive.appex/Info.plist'
      - uses: actions/upload-artifact@v4
        with:
          name: Shiftly-1.9.0-unsigned-IPA
          path: Shiftly-1.9.0-unsigned.ipa
          if-no-files-found: error
