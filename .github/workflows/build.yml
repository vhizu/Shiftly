
name: Build Shiftly 1.4.3 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Shiftly.xcodeproj \
            -scheme Shiftly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify version and extensions
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app"
          test -d "$APP"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$VERSION" = "1.4.3" || {
            echo "Wrong app version: $VERSION"
            exit 1
          }

          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          test "$BUNDLE" = "com.shiftly.app" || exit 1

          for EXT in ShiftlyLive ShiftlyHomeWidget; do
            PLIST="$APP/PlugIns/$EXT.appex/Info.plist"
            test -f "$PLIST" || {
              echo "Missing extension: $EXT"
              exit 1
            }

            case "$EXT" in
              ShiftlyLive) EXPECTED=com.shiftly.app.live ;;
              ShiftlyHomeWidget) EXPECTED=com.shiftly.app.home ;;
            esac

            FOUND=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
            test "$FOUND" = "$EXPECTED" || {
              echo "Wrong bundle ID for $EXT: $FOUND"
              exit 1
            }
          done

          test -f "$APP/PlugIns/ShiftlyLive.appex/Assets.car"

          echo "Shiftly 1.4.3 validated successfully"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app" \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          zip -qry \
            "$GITHUB_WORKSPACE/Shiftly-1.4.3-unsigned.ipa" \
            Payload

          unzip -l "$GITHUB_WORKSPACE/Shiftly-1.4.3-unsigned.ipa" \
            | grep 'ShiftlyHomeWidget.appex/Info.plist'

          unzip -l "$GITHUB_WORKSPACE/Shiftly-1.4.3-unsigned.ipa" \
            | grep 'ShiftlyLive.appex/Info.plist'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shiftly-1.4.3-unsigned-IPA
          path: Shiftly-1.4.3-unsigned.ipa
          if-no-files-found: error
