name: Build Shiftly 1.10.0 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3 for native Liquid Glass
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Verify actual Xcode and iOS SDK versions
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE=$(xcodebuild -version | awk '/^Xcode / {print $2}')
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Selected Xcode: $XCODE, iOS SDK: $SDK"
          test "${XCODE%%.*}" -ge 26 || { echo "ERROR: Xcode 26+ required for glassEffect"; exit 1; }
          test "${SDK%%.*}" -ge 26 || { echo "ERROR: iOS 26+ SDK required"; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate design, JSON import and island assets
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          live = Path("ShiftlyLive/ShiftlyLive.swift").read_text()
          backup = Path("Shiftly/BackupCenterView.swift").read_text()
          design = Path("Shiftly/ShiftlyDesign.swift").read_text()
          assert 'Text(timerInterval:' in live, "Live countdown missing"
          assert 'Button(intent: FinishBreakIntent())' in live, "Lock screen action missing"
          assert 'Image("IslandIconBreak")' in live, "Verified mascot asset not referenced"
          assert Path('ShiftlyLive/Assets.xcassets/IslandIconBreak.imageset/IslandIconBreak.png').is_file()
          assert 'UIDocumentPickerViewController' in backup, "Broad JSON picker missing"
          assert 'saveBeforeRestore' in backup, "Pre-restore backup missing"
          assert 'glassEffect(.regular, in: shape)' in design, "Native Liquid Glass cards missing"
          assert 'LazyVGrid(columns:' in Path("Shiftly/MainView.swift").read_text(), "Equal-width quick actions missing"
          assert 'frame(height: 35)' in live, "Compact lock screen button missing"
          assert 'backupAction("Обновить файлы"' in backup, "Visible refresh tile missing"
          models = Path("Shared/ShiftlyModels.swift").read_text()
          store = Path("Shiftly/ShiftStore.swift").read_text()
          island = Path("Shared/ShiftlyIntents.swift").read_text()
          phrases = Path("Shiftly/MascotLines.swift").read_text()
          project = Path("project.yml").read_text()
          assert 'enum BreakKind:' in models and 'case lunch' in models, "Separate lunch kind missing"
          assert 'kind: BreakKind? = nil' in models, "Backwards-compatible JSON kind missing"
          assert 'func startBreak(kind: BreakKind)' in store, "Lunch state machine missing"
          assert 'func undoLastBreakAction()' in store, "Break undo missing"
          assert 'kind: kind' in Path("Shiftly/BreakAlerts.swift").read_text(), "Lunch Live Activity missing"
          assert 'var breakType: BreakKind' in island, "Live Activity state kind missing"
          assert 'INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait' in project, "Portrait lock missing"
          assert 'case lunch, lunchLate' in phrases, "Lunch phrases missing"
          assert len(__import__('re').findall(r'^            "', phrases, __import__('re').M)) >= 140, "Not enough mascot lines"
          main = Path("Shiftly/MainView.swift").read_text()
          assert 'HomeMascotBackdrop(onBreak:' in main, "Background mascot missing"
          assert 'HomeMascotMood(mood:' in main, "Mascot reaction caption missing"
          assert 'MascotPanel(' not in main, "Old mascot card still present"
          assert not Path('Shiftly/Assets.xcassets/MascotDone.imageset').exists(), "Opaque white mascot asset still present"
          for asset in ('MascotWork', 'MascotBreak'):
            assert Path(f'Shiftly/Assets.xcassets/{asset}.imageset/{asset}.png').is_file(), "Mascot art missing"

          print("Shiftly 1.10.0 source validations OK")
          PYCODE
      - name: Test old JSON and lunch model without iOS UI
        run: |
          set -euo pipefail
          swiftc Shared/ShiftlyModels.swift Tests/ModelCompatibility.swift -o "$RUNNER_TEMP/shiftly-model-tests"
          "$RUNNER_TEMP/shiftly-model-tests"
      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild -project Shiftly.xcodeproj -scheme Shiftly -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO clean build
      - name: Verify version, app extensions and Live Activity assets
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.10.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.shiftly.app"
          for EXT in ShiftlyLive ShiftlyHomeWidget; do
            PLIST="$APP/PlugIns/$EXT.appex/Info.plist"
            test -f "$PLIST"
            case "$EXT" in
              ShiftlyLive) EXPECTED=com.shiftly.app.live ;;
              ShiftlyHomeWidget) EXPECTED=com.shiftly.app.home ;;
            esac
            FOUND=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
            test "$FOUND" = "$EXPECTED" || { echo "Wrong $EXT bundle ID: $FOUND"; exit 1; }
          done
          test -f "$APP/PlugIns/ShiftlyLive.appex/Assets.car"
          # Xcode must write the actual orientation array, not merely a build setting.
          python3 - "$APP/Info.plist" <<'PYPLIST'
          import sys, plistlib
          with open(sys.argv[1], 'rb') as handle:
            info = plistlib.load(handle)
          orientations = info.get('UISupportedInterfaceOrientations')
          assert orientations == ['UIInterfaceOrientationPortrait'], f'Unexpected orientations: {orientations!r}'
          print('iPhone orientation: portrait only')
          PYPLIST
          for EXT in ShiftlyLive ShiftlyHomeWidget; do
            EXT_PLIST="$APP/PlugIns/$EXT.appex/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT_PLIST"
            /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$EXT_PLIST"
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT_PLIST"
          done
          echo "Validated app 1.10.0 and both embedded extensions"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Shiftly-1.10.0-unsigned.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/Shiftly-1.10.0-unsigned.ipa" | grep 'ShiftlyHomeWidget.appex/Info.plist'
          unzip -l "$GITHUB_WORKSPACE/Shiftly-1.10.0-unsigned.ipa" | grep 'ShiftlyLive.appex/Info.plist'
      - uses: actions/upload-artifact@v4
        with:
          name: Shiftly-1.10.0-unsigned-IPA
          path: Shiftly-1.10.0-unsigned.ipa
          if-no-files-found: error
