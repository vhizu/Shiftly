name: Build Shiftly 1.3 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project Shiftly.xcodeproj -scheme Shiftly -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Shiftly.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/Shiftly-1.3-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Shiftly-1.3-unsigned-IPA
          path: Shiftly-1.3-unsigned.ipa
