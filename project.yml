name: Shiftly
options:
  bundleIdPrefix: com.shiftly
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Shiftly:
    type: application
    platform: iOS
    sources: [Shiftly]
    dependencies:
      - target: ShiftlyLive
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftly.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        MARKETING_VERSION: '1.3.0'
        CURRENT_PROJECT_VERSION: '6'
        INFOPLIST_KEY_CFBundleDisplayName: Shiftly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES

  ShiftlyLive:
    type: app-extension
    platform: iOS
    sources: [ShiftlyLive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftly.app.live
        MARKETING_VERSION: '1.3.0'
        CURRENT_PROJECT_VERSION: '6'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShiftlyLive/Info.plist
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: '5.0'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
